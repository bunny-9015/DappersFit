<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dappersfit — Offline</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8862f;
      --gold-light: #d4a843;
      --bg: #0f172a;
      --surface: #1c1b1a;
      --border: #2a2826;
      --text: #f1f5f9;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background orbs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: var(--gold);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: #3b82f6;
      bottom: -80px; right: -80px;
      animation-delay: -4s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.05); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    .logo-ring {
      width: 96px;
      height: 96px;
      margin: 0 auto 2rem;
      position: relative;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--gold), transparent, var(--gold));
      animation: spin 3s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: var(--surface);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -1px;
    }

    .card {
      background: rgba(28, 27, 26, 0.8);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .wifi-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      color: var(--muted);
      position: relative;
    }
    .wifi-slash {
      position: absolute;
      top: 50%; left: 50%;
      width: 72px; height: 2px;
      background: #ef4444;
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 2px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(184, 134, 47, 0.15);
      border: 1px solid rgba(184, 134, 47, 0.3);
      color: var(--gold);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .tip-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .tip-box h3 {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .tip-list {
      list-style: none;
      text-align: left;
    }
    .tip-list li {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0.25rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tip-list li::before {
      content: '→';
      color: var(--gold);
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      letter-spacing: 0.01em;
      width: 100%;
    }
    .btn-primary {
      background: var(--gold);
      color: #000;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(184,134,47,0.35);
    }
    .btn-primary:active { transform: translateY(0); }

    .footer-text {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #374151;
      font-family: monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <div class="logo-ring">
      <div class="logo-inner">D</div>
    </div>

    <div class="card">
      <div class="badge">
        <span class="badge-dot"></span>
        No Connection
      </div>

      <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="2"/>
        <div class="wifi-slash"></div>
      </svg>

      <h1>You're Offline</h1>
      <p>Dappersfit can't connect to the server right now. Check your internet connection and try again.</p>

      <div class="tip-box">
        <h3>While you wait</h3>
        <ul class="tip-list">
          <li>Cached pages may still be available</li>
          <li>Check your Wi-Fi or mobile data</li>
          <li>Your unsaved changes are preserved</li>
        </ul>
      </div>

      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        Try Again
      </button>
    </div>

    <p class="footer-text">Dappersfit · Order Management System</p>
  </div>

  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
